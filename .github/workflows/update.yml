name: Update data and publish site

on:
  # Rebuild whenever you edit rankings.csv or anything else in the repo
  push:
    branches: [main]
  # Offseason (Oct-Mar): once a day, around 7am Eastern
  # Season (Apr-Sep): every 30 minutes so promotions and call-ups show up fast
  schedule:
    - cron: "17 11 * 1-3,10-12 *"
    - cron: "7,37 * * 4-9 *"
  # Adds a "Run workflow" button on the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull latest stats and transactions from MLB
        run: node scripts/update.mjs

      - name: Save the new data to the repo
        run: |
          git config user.name "prospect-ledger-bot"
          git config user.email "prospect-ledger-bot@users.noreply.github.com"
          git add site/data
          git diff --staged --quiet || (git commit -m "Update prospect data [skip ci]" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
